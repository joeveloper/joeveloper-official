name: Website build

on:
  push:
    branches:
      - feat/milestone-1-figma-v3-homepage
      - feat/milestone-2a-services
  pull_request:
    branches:
      - main
      - feat/milestone-1-figma-v3-homepage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
